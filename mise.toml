# This repo's own check tools. Nothing here is installed globally.
[tools]
bats = "1.14.0"
shellcheck = "0.11.0"

[tasks.check]
description = "Run dotfiles validation."
run = "bash scripts/test.sh"

[tasks.audit]
description = "List installed apps and packages no Brewfile covers."
run = "bash scripts/report-unmanaged-brew-apps.sh"

# Known false positives: placeholder values from documentation examples in
# third-party skills that were once vendored here. Listed by exact value, so
# a real secret anywhere (even in those files) is still reported.
[extend]
useDefault = true

[allowlist]
description = "Documentation placeholder values"
regexTarget = "match"
regexes = [
  '''YOUR_API_TOKEN''',
  '''sk_live_abc123''',
  '''kL9xQn2VwM8pYrTb4ZcHjF''',
  '''pR8mNv5KqXzGwY2JtCfL4D''',
]

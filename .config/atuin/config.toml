search_mode = "fuzzy"
filter_mode = "global"
filter_mode_shell_up_key_binding = "session"

style = "compact"
inline_height = 20
show_preview = true
show_help = false
show_tabs = false

enter_accept = false

history_filter = [
    "^export ",
    "^set ",
]


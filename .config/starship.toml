add_newline = true
command_timeout = 500
scan_timeout = 10

format = "$username$hostname$directory$git_branch$git_status$python$nodejs$rust$golang$terraform$docker_context$cmd_duration$line_break$status$character"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold yellow)"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold blue"
truncation_length = 3
truncation_symbol = ".../"
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
format = "[$symbol$branch]($style) "
style = "purple"
symbol = " "
truncation_length = 28
truncation_symbol = "..."

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "yellow"

[cmd_duration]
format = "[$duration]($style) "
min_time = 1000
style = "dimmed white"

[python]
format = "[py $version( $virtualenv)]($style) "
style = "yellow"

[nodejs]
format = "[node $version]($style) "
style = "green"

[rust]
format = "[rs $version]($style) "
style = "red"

[golang]
format = "[go $version]($style) "
style = "cyan"

[terraform]
format = "[tf $version( $workspace)]($style) "
style = "purple"

[docker_context]
format = "[docker $context]($style) "
style = "blue"
only_with_files = false
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile", "compose.yml", "compose.yaml"]

[username]
show_always = false

[hostname]
ssh_only = true
format = "[$hostname]($style) "

[status]
disabled = false
format = "[exit $status]($style) "

[package]
disabled = true

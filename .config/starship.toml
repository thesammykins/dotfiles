add_newline = true
command_timeout = 500
scan_timeout = 10

format = "$directory$git_branch$git_status$cmd_duration$python$nodejs$rust$golang$terraform$docker_context$line_break$character"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold yellow)"

[directory]
format = "[$path]($style) "
style = "bold blue"
truncation_length = 3
truncation_symbol = ".../"
truncate_to_repo = true
read_only = " ro"

[git_branch]
format = "[$symbol$branch]($style) "
style = "purple"
symbol = "git:"
truncation_length = 28
truncation_symbol = "..."

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "yellow"

[cmd_duration]
format = "[$duration]($style) "
min_time = 1000
style = "dimmed white"

[python]
format = "[py]($style) "
style = "yellow"

[nodejs]
format = "[node]($style) "
style = "green"

[rust]
format = "[rs]($style) "
style = "red"

[golang]
format = "[go]($style) "
style = "cyan"

[terraform]
format = "[tf]($style) "
style = "purple"

[docker_context]
format = "[docker]($style) "
style = "blue"
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile", "compose.yml", "compose.yaml"]

[username]
disabled = true

[hostname]
disabled = true

[package]
disabled = true

# Rex hosts and anything else on the tailnet, by Tailscale IP or MagicDNS
# name. They all take the "SSH Key" item from the 1Password agent, and only
# that key, so the agent's key order can't run into the server's MaxAuthTries.
#
# Key only: if Rex dials before 1Password is running (at login), ssh fails at
# once and Rex retries, instead of waiting forever on a password prompt.
#
# scripts/install.sh includes this file at the top of ~/.ssh/config.
Host 100.* *.ts.net
    IdentityAgent "~/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock"
    IdentityFile ~/.ssh/ssh-key.pub
    IdentitiesOnly yes
    PreferredAuthentications publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
